name: smart-logistics-biv
services:
  oltp:
    image: postgres:17
    container_name: smart-logistics-oltp-biv
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${OLTP_USER}
      POSTGRES_PASSWORD: ${OLTP_PASS}
      POSTGRES_DB: ${OLTP_DB}

    ports:
      - "${OLTP_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/oltp:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OLTP_USER} -d ${OLTP_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  dwh:
    image: postgres:17
    container_name: smart-logistics-dwh-biv
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DWH_DB}
      POSTGRES_USER: ${DWH_USER}
      POSTGRES_PASSWORD: ${DWH_PASS}
    ports:
      - "${DWH_PORT}:5432"
    volumes:
      - dwh_data:/var/lib/postgresql/data
      - ./migrations/dwh:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DWH_USER} -d ${DWH_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-db:
    image: postgres:17
    container_name: smart-logistics-airflow-db-biv
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${AIRFLOW_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_PASS}
      POSTGRES_DB: airflow

    ports:
    - "5433:5432"

    volumes:
      - airflow_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_USER} -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    image: apache/airflow:2.10.5
    container_name: smart-logistics-airflow-init-biv

    depends_on:
      airflow-db:
        condition: service_healthy

    build:
      context: .
      dockerfile: Dockerfile

    environment:
      PYTHONPATH: /opt/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_USER}:${AIRFLOW_PASS}@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_WWW_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_WWW_PASS}

    command: >
      bash -c "airflow db migrate &&
      airflow users create
      --username ${AIRFLOW_WWW_USER}
      --password ${AIRFLOW_WWW_PASS}
      --firstname Admin
      --lastname Admin
      --role Admin
      --email admin@example.com || true"

  airflow-webserver:
    image: apache/airflow:2.10.5
    container_name: smart-logistics-airflow-webserver-biv
    restart: unless-stopped

    build:
      context: .
      dockerfile: Dockerfile

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      PYTHONPATH: /opt/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_USER}:${AIRFLOW_PASS}@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__CORE__HOSTNAME_CALLABLE: airflow.utils.net.get_host_ip_address
      AIRFLOW_CONN_OLTP_POSTGRES: "postgresql://${OLTP_USER}:${OLTP_PASS}@oltp:5432/${OLTP_DB}"
      AIRFLOW_CONN_DWH_POSTGRES: "postgresql://${DWH_USER}:${DWH_PASS}@dwh:5432/${DWH_DB}"

    ports:
      - "8080:8080"

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/etl:/opt/airflow/etl
      - ./core:/opt/airflow/core
      - ./volumes:/opt/airflow/volumes
      - ./ml:/opt/airflow/ml

    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.10.5
    container_name: smart-logistics-airflow-scheduler-biv
    restart: unless-stopped

    build:
      context: .
      dockerfile: Dockerfile

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      PYTHONPATH: /opt/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_USER}:${AIRFLOW_PASS}@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__CORE__HOSTNAME_CALLABLE: airflow.utils.net.get_host_ip_address
      AIRFLOW_CONN_OLTP_POSTGRES: "postgresql://${OLTP_USER}:${OLTP_PASS}@oltp:5432/${OLTP_DB}"
      AIRFLOW_CONN_DWH_POSTGRES: "postgresql://${DWH_USER}:${DWH_PASS}@dwh:5432/${DWH_DB}"

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/etl:/opt/airflow/etl
      - ./core:/opt/airflow/core
      - ./volumes:/opt/airflow/volumes
      - ./ml:/opt/airflow/ml

    command: scheduler

volumes:
  postgres_data:
  dwh_data:
  airflow_data: